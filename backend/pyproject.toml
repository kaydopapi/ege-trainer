[project]
name = "ege-trainer-api"
version = "0.1.0"
description = "API тренажёра ЕГЭ по русскому языку"
readme = "README.md"
authors = [
    { name = "khoryx", email = "polo-twig-selected@duck.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
ege-trainer-api = "ege_trainer_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
